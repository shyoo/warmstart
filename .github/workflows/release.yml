# Release: build installers, attest them, publish a GitHub Release.
#
# ⛔ **This workflow never runs on a push to a branch.** It fires on a `v*` tag, or by hand. That is
# deliberate: `ci.yml` is the thing that runs per push, and a release build is the expensive one —
# it is the only workflow here that touches macOS.
#
# ⚠️ **Cost.** Private-repo rates as of 2026-01: Linux **$0.006/min**, Windows **$0.010/min**, macOS
# **$0.062/min** — macOS is roughly 10x Linux. ⭐ On a **public** repository, standard runners are
# free and unlimited, so every number here becomes zero the day the repo goes public. Until then, use
# the `platforms` input below and build one platform at a time while iterating on this file.
#
# ⛔ **No tests run here.** `ci.yml` already ran the suites on the commit being tagged, and repeating
# them would double the bill for no new information. The first step *checks* that rather than
# expecting it: the tagged commit must be on `main` with a green CI run.
#
# ⭐ **The tag is the version and its message is the notes.** Nothing about a release lives in a
# tracked file (`scripts/version.mjs`, `scripts/release-tag.mjs`): `/release rc` pushes one annotated
# tag on a commit CI already passed, and `/release promote` pushes the final tag on the same commit.
# The build below is told its version through `WARMSTART_VERSION`, which `electron-builder.js` and
# the bundles' `__APP_VERSION__` both read.
#
# ⛔ **`publish: null` in electron-builder.base.yml is intentional and stays.** Packaged Warmstart polls
# this Release and can download its matching SHA-256-verified installer, but it never runs or
# installs that file. This workflow uploads artifacts; a human installs them.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (cost control while iterating)'
        type: choice
        default: 'windows'
        options:
          - windows
          - macos
          - windows+macos
          - all
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: true

permissions:
  contents: write        # create the release
  id-token: write        # attestations
  attestations: write    # attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  electron_config_cache: ${{ github.workspace }}/.electron-cache
  ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
  # A tag build carries the tag's version; a manual run is left to `git describe` (hence the full
  # checkouts below), which yields `<last tag>+<n>.g<sha>` and always publishes as a pre-release.
  WARMSTART_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A tag builds what ships. A manual run builds only what you asked for, so testing this
        # workflow does not cost a macOS build every time.
        os: ${{ fromJSON(
          github.event_name == 'push' && '["windows-latest","macos-latest"]'
          || inputs.platforms == 'windows' && '["windows-latest"]'
          || inputs.platforms == 'macos' && '["macos-latest"]'
          || inputs.platforms == 'all' && '["windows-latest","macos-latest","ubuntu-latest"]'
          || '["windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Everything a tag must be, checked before `npm ci` so a mistake costs seconds rather than two
      # installer builds: a semver name, an *annotated* tag (its message is the release notes), a
      # commit that is on `main`, and a CI run on that commit that succeeded. `scripts/release-tag.mjs`
      # refuses all four before pushing; this is the same gate on the side that publishes.
      - name: Verify the tag is a version, is annotated, is on main, and its commit passed CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "$TAG is not a version tag" >&2; exit 1; }
          # actions/checkout leaves the tag ref pointing at the commit; fetch the tag object itself.
          git fetch --force --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "$TAG")" = tag || { echo "$TAG is a lightweight tag: no notes. Cut it with /release." >&2; exit 1; }
          test -n "$(git tag -l --format='%(contents:body)' "$TAG" | tr -d '[:space:]')" || { echo "$TAG carries no notes" >&2; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG points at $GITHUB_SHA, which is not on main" >&2; exit 1; }
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
          test "$conclusion" = success || { echo "CI on $GITHUB_SHA concluded '$conclusion', not success" >&2; exit 1; }
          echo "$TAG: annotated, on main, CI green. Building as $(node scripts/version.mjs)."
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure the Electron binary is present
        run: node scripts/ensure-electron.mjs

      # ⚠️ macOS signing is opt-in on the presence of secrets, so this workflow still produces an
      # (unsigned) build before the certificate is wired up. electron-builder reads these env names
      # directly. ⛔ But an unsigned build proves nothing about the hardened runtime, because the
      # hardened runtime is a *signing* flag — `electron-builder.base.yml` now asks for it, and a runner
      # with no certificate silently produces a bundle that never had it applied. The real test is
      # the Mac (`docs/development.md` §3), not this job.
      #
      # ⛔ Notarisation is enabled here and nowhere else. `electron-builder.base.yml` pins `notarize:
      # false` so a local build is fast and deterministic; `dist:mac:release` overrides it, and is
      # chosen only when the credentials to do it are actually present — otherwise app-builder-lib
      # throws `InvalidConfigurationError` on a partially configured secret set rather than skipping.
      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          case "${{ runner.os }}" in
            Windows) npm run dist:win ;;
            Linux)   npm run dist:linux ;;
            macOS)
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                echo "Apple credentials present — building signed and notarised."
                npm run dist:mac:release
              else
                echo "::warning::APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID not all set."
                echo "::warning::Building without notarisation. Gatekeeper will refuse this .dmg."
                npm run dist:mac
              fi
              ;;
          esac

      # ⛔ Say what was actually produced, rather than what the config asked for. `hardenedRuntime:
      # true` is a request; whether it was applied depends on a certificate having been found, and
      # the difference is invisible in the installer's filename. A `flags=0x10000(runtime)` line here
      # is the only thing in this workflow that proves the hardened runtime shipped.
      - name: What did the signing actually do?
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          app=$(find release -maxdepth 2 -name 'Warmstart.app' -print -quit)
          if [ -z "$app" ]; then echo "no .app found under release/"; exit 0; fi
          echo "== $app"
          codesign --display --verbose=2 "$app" 2>&1 || true
          echo "== gatekeeper assessment"
          spctl --assess --type execute --verbose=2 "$app" 2>&1 || true

      # Only the installers. electron-builder leaves unpacked trees and blockmaps in release/ that
      # nobody should download.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-out
          find release -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist-out/ \;
          ls -la dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest · checksum · publish
    needs: build
    runs-on: ubuntu-latest   # ⭐ cheapest runner; this job only moves files around
    steps:
      # Only for the version and the tag's notes; nothing is built here.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Read the version and its notes
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(node scripts/version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A `-` in the version (0.1.0-rc.1) is a pre-release. ⛔ That decides more than a badge:
          # packaged Warmstart polls `/releases/latest`, which GitHub never answers with a
          # pre-release or a draft, so an `-rc` build is invisible to installed apps by
          # construction and a final version is the first thing they can see.
          case "$version" in *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;; *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;; esac
          # The changelog is the annotated tag's body, written by `/release` at tag time.
          : > changelog.md
          if [ -n "$TAG" ]; then
            git fetch --force --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents:body)' "$TAG" > changelog.md
          fi
          if [ -s changelog.md ]; then
            echo "notes=changelog.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
            echo "::warning::no tag notes; the release carries no changelog."
          fi

      - name: List what will be published
        run: ls -la staging

      # ⛔ **Attestation needs a public repository, and that is a launch-sequencing fact, not a detail.**
      # Measured 2026-09-12 on the first run of this workflow (34667784414): the build succeeded and
      # this step failed with GitHub's own words — *"Failed to persist attestation: Feature not
      # available for user-owned private repositories. To enable this feature, please make this
      # repository public."* ⭐ So §4.1's first mitigation for shipping Windows **unsigned** — the
      # "strongest honest substitute for a code-signing cert" — is not independent of going public:
      # until the repo is public there is no attestation to offer, only checksums.
      - name: Can this repository attest?
        id: attestable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh repo view "${{ github.repository }}" --json visibility -q .visibility)
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
          if [ "$visibility" = "PUBLIC" ]; then echo 'ok=true' >> "$GITHUB_OUTPUT"; else echo 'ok=false' >> "$GITHUB_OUTPUT"; fi
          echo "repository is $visibility"

      # ⚠️ Skipped rather than tolerated. `continue-on-error` here would let a *genuine* attestation
      # failure on a public repo pass as though the binaries were attested, and the notes below decide
      # what to claim from this step's outcome.
      - name: Attest build provenance
        if: steps.attestable.outputs.ok == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'staging/*'

      - name: Generate checksums
        working-directory: staging
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # ⛔ **The notes claim an attestation only when one was actually made.** A release that says its
      # binaries carry signed provenance when the step was skipped is the download-page version of a
      # landing that landed nothing: the same invariant, that every belief carries its basis.
      # The changelog comes first and is written by a person (or `/release`) at bump time; everything
      # after it is derived from what is in staging.
      - name: Write the release notes
        env:
          ATTESTED: ${{ steps.attestable.outputs.ok }}
          CHANGELOG: ${{ steps.version.outputs.notes }}
        run: |
          : > notes.md
          if [ -n "$CHANGELOG" ]; then
            cat "$CHANGELOG" >> notes.md
            echo >> notes.md
          fi
          cat >> notes.md <<NOTES
          ## Verify your download

          Every artifact is checksummed in \`SHA256SUMS.txt\`.
          NOTES
          if [ "$ATTESTED" = 'true' ]; then
            cat >> notes.md <<NOTES

          Each one also carries a signed build attestation tying it to the commit and workflow run that
          produced it:

          \`\`\`bash
          gh attestation verify <file> --repo ${{ github.repository }}
          \`\`\`
          NOTES
          else
            cat >> notes.md <<NOTES

          > ⚠️ **These binaries are not attested.** Build provenance attestation is unavailable on a
          > private repository, so the checksums above are the only verification offered for this
          > build. Releases published after this repository goes public carry attestations as well.
          NOTES
          fi
          # ⛔ **A platform gets a section only when its installer is in the release.** Found 2026-09-12
          # by reading what run 34668187579 actually published: a `platforms=windows` build carried
          # *"macOS — Apple Silicon and Intel builds are both provided"* over a release containing one
          # `.exe`. Same fault as the attestation claim, one line further down the same file — the
          # notes are written from what the build was *meant* to produce rather than from what is
          # there. A tag build hides it, because a tag builds both.
          if ls staging/*.exe >/dev/null 2>&1; then
            cat >> notes.md <<NOTES

          ## Windows

          Builds are **unsigned**, so SmartScreen will warn: *More info* → *Run anyway*. Verify the
          checksum above if you would rather not take it on trust.
          NOTES
          fi
          if ls staging/*.dmg >/dev/null 2>&1; then
            cat >> notes.md <<NOTES

          ## macOS

          Apple Silicon and Intel builds are both provided.
          NOTES
          fi
          # ⚠️ Tested separately: `ls a b` exits non-zero when *either* operand is missing, so one
          # `ls` over both globs reported no Linux build while an AppImage sat in staging (measured).
          if ls staging/*.AppImage >/dev/null 2>&1 || ls staging/*.deb >/dev/null 2>&1; then
            cat >> notes.md <<NOTES

          ## Linux

          ⚠️ Built, and **never run against a real agent CLI**. Unsupported.
          NOTES
          fi
          cat >> notes.md <<NOTES

          > **Pre-alpha.** Expect rough edges, and please report them.
          NOTES
          cat notes.md

      # ⚠️ A manual run produces a **draft** by default, so this pipeline can be exercised end to end
      # without ever publishing to the world by accident. A tag publishes; whether as a pre-release
      # is the version's call (the `version` step above), never this file's. An untagged run is
      # always a pre-release, so it can never become `/releases/latest`.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('untagged-{0}', github.run_id) }}
          DRAFT: ${{ (github.event_name == 'workflow_dispatch' && inputs.draft) && '--draft' || '' }}
          PRERELEASE: ${{ (github.ref_type != 'tag' || steps.version.outputs.prerelease == 'true') && '--prerelease' || '' }}
        run: |
          gh release create "$TAG" staging/* \
            --repo "${{ github.repository }}" \
            --title "Warmstart $TAG" \
            --notes-file notes.md \
            $PRERELEASE $DRAFT
