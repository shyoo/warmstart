# Packaging - the settings, and the only config electron-builder reads. ⛔ Do not add an
# `electron-builder.js` beside it to compute anything: one existed for a day, and on Windows CI it
# made `electron-builder --dir` exit 0 without packaging anything (see `scripts/pack.mjs`). The
# version is not here either - it is a git fact passed on the command line by that script.
#
# ⛔ Two things in this file are load-bearing rather than boilerplate, and both come from decisions
# taken much earlier:
#
#  1. `asarUnpack` for node-pty. A native `.node` cannot be loaded from inside an asar archive — the
#     archive is a virtual filesystem and `dlopen` needs a real path. Everything else stays packed.
#     ⚠️ `node:sqlite` deliberately does not appear here: it was chosen at M1 *because* it ships
#     inside Electron's own Node, so there is no second native module to unpack, rebuild, or explain.
#  2. `extraMetadata.main` is not set and must not be. The daemon and the MCP server are spawned as
#     separate processes with `process.execPath` + `ELECTRON_RUN_AS_NODE=1`, which is what lets a
#     packaged app run its own background service with no system Node installed and no ABI mismatch.
#     They read their own bundles out of the asar, which works because Electron-as-Node keeps the
#     patched `fs`.

appId: io.github.shyoo.warmstart
productName: Warmstart
copyright: Copyright © 2026 Sunghwan Yoo
# The version is passed in by scripts/pack.mjs; package.json carries a placeholder on purpose.
# This exact spelling is also the only asset shape the in-app downloader accepts.
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

# The built output plus the runtime dependencies. Source and tests are not shipped.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# ⚠️ Runtime icons are not redundant with `buildResources`: the builder consumes the latter to stamp
# the executable/bundle, while BrowserWindow and Tray need real files after packaging. Windows Tray
# uses the multi-resolution `.ico`; Linux and macOS use the PNG. See `trayIconPath()`.
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico

asar: true
asarUnpack:
  # ⚠️ The whole scope, not `@lydell/node-pty`. The `.node` files do not live in that package - they
  # are in per-platform siblings (`node-pty-win32-x64`, `node-pty-darwin-arm64`, ...), so a glob
  # naming the parent matches nothing. electron-builder auto-unpacks anything containing a `.node`
  # and would have covered it anyway; relying on that silently is how this gets broken by a version
  # bump nobody connects to a PTY that stopped opening.
  - '**/node_modules/@lydell/**'

# ⚠️ Not shipped, deliberately: `costmodels/` is compiled into the daemon bundle rather than copied
# beside it, so a packaging slip cannot leave the scheduler unable to price anything. A user file in
# their data directory still wins at runtime. See costmodel.ts.
#
# `benchmarks/` follows the identical rule for the same reason, and its loader (benchmarks.ts) is
# built the same way costmodel.ts is: a prior that vanished in the packaged app because a directory
# was not copied is not a failure worth having.

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # ⛔ Unsigned. Windows SmartScreen will warn, and that is the honest state of a pre-alpha rather
  # than something to work around. Signing is a certificate and a release process, not a config line.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # ⛔ The isolation roots and the database live in the user's data directory, never beside the
  # binary. Uninstalling must not take an account's credentials with it — retiring a worker is a
  # deliberate act, and so is deleting one.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # ⛔ `identity` is deliberately *absent*, not `null`. Measured in app-builder-lib 26.15.3,
  # `macPackager.js` `sign()`: `identity: null` takes the `handleNullIdentity()` branch and returns
  # before anything else runs — and notarisation is called from *inside* `sign()`, so a null identity
  # silently disables both. Absent means auto-discovery: electron-builder looks for a "Developer ID
  # Application" certificate in the keychain, signs with it if it finds one, and carries on unsigned
  # with a warning if it does not. ⚠️ A machine with no certificate therefore still builds, and what
  # it builds is *not* hardened — the hardened runtime is a signing flag, so an unsigned app proves
  # nothing about it. `CSC_IDENTITY_AUTO_DISCOVERY=false` forces unsigned on a machine that has one.
  #
  # Notarisation requires the hardened runtime, and the hardened runtime is the single setting most
  # likely to break this app: it enforces library validation on every `.node` loaded, and
  # `@lydell/node-pty` is loaded out of `app.asar.unpacked` (see `asarUnpack` above) and spawns a
  # helper binary of its own. ⚠️ **Never run on a Mac.** `docs/development.md` §3 has the checklist.
  # ⚠️ `true` is also the app-builder-lib default for a non-MAS build (`MacTargetHelper.js`,
  # `config.hardenedRuntime !== false`); it is stated here because this is a decision, not a default.
  hardenedRuntime: true
  # Entitlements come from `resources/entitlements.mac.plist` and `.inherit.plist`, which
  # electron-builder picks up by name out of `buildResources` — no path in this file to get wrong.
  # ⛔ Their presence *replaces* electron-builder's built-in template rather than adding to it, so
  # they restate every key it carries. Read the header in the plist before removing one.
  #
  # ⛔ Notarisation is a release step, not part of the inner loop. Left unset, app-builder-lib
  # notarises whenever signing succeeded and `APPLE_ID` / `APPLE_APP_SPECIFIC_PASSWORD` /
  # `APPLE_TEAM_ID` happen to be in the environment (`MacTargetHelper.getNotarizeOptions`) — so one
  # exported variable would add minutes to every local build, and a half-set trio throws
  # `InvalidConfigurationError` in the middle of packaging. `false` makes the local answer the same
  # on every machine; `npm run dist:mac:release` overrides it to `true` for the build that ships.
  notarize: false

linux:
  # ⛔ Set explicitly, because electron-builder does NOT use `productName` verbatim here. On Windows
  # and macOS the executable is `Warmstart`; on Linux the name is sanitised, and the
  # rename turned `agentyard` - a string no sanitiser touches - into one that it does. The packaged
  # suite went looking for a binary that was never built. Naming it here means one string decides,
  # and it is also the `Exec` line in the .desktop entry.
  executableName: warmstart
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: A scheduler with a budget for coding agents
  description: >-
    Runs a fleet of coding agents across the accounts you own and routes each task to the worker,
    session and moment where it is cheapest to run.

# The app polls GitHub Releases and downloads only a SHA-256-verified installer matching this exact
# filename shape. It never runs or installs that file: replacement remains a deliberate action.
publish: null
