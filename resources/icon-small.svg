<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Warmstart">
  <title>Warmstart</title>
  <desc>A warm sunrise shaped as a W, drawn for 16 and 24 pixels.</desc>
  <!--
    The 16px and 24px layers of the .ico, and the favicon.
    ⚠️ Not a scaled copy of icon.svg. Below ~24px the hairline border and the gap around the mark are
    the first things to turn to mud, so both are gone and the mark is larger; the corner radius is
    reduced because a 114/512 radius at 16px eats the corners entirely. Same drawing, different
    drawing *for a different size* - which is what an .ico's separate layers are for.
    ⚠️ The sun does not touch the W here, where it overlaps in icon.svg. Rendered at 16px the overlap
    merged the two into one blot; a gap of about one pixel (32 units) keeps them two shapes.
  -->
  <rect width="512" height="512" rx="88" fill="#0e1013"/>
  <circle cx="256" cy="136" r="84" fill="#ffbb66"/>
  <path d="M74 258 156 422 256 296 356 422 438 258" fill="none" stroke="#7aa2f7" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
