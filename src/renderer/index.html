<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Local-only app: no remote origins, no inline script, and `connect-src 'none'` because the
      renderer does not talk to the daemon directly - every call goes through the preload bridge to
      the main process, which is the only thing holding the endpoint token.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />
    <!-- ⚠️ Same-origin, not a data: URI. The CSP below allows `data:` for images, but a favicon
         served from `public/` is one file the app already ships and one fewer inline blob to keep
         in step with resources/icon-small.svg, which is what generates it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Warmstart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
